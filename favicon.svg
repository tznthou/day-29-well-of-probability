<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- 水面漸層 -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- 硬幣金屬漸層 -->
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- 背景 (深色井底) -->
  <rect width="32" height="32" fill="#0f172a" rx="4"/>

  <!-- 水面 -->
  <ellipse cx="16" cy="20" rx="14" ry="6" fill="url(#water)"/>

  <!-- 漣漪 (由內到外) -->
  <ellipse cx="16" cy="20" rx="4" ry="2" fill="none" stroke="#67e8f9" stroke-width="0.8" opacity="0.9"/>
  <ellipse cx="16" cy="20" rx="8" ry="3.5" fill="none" stroke="#67e8f9" stroke-width="0.6" opacity="0.6"/>
  <ellipse cx="16" cy="20" rx="12" ry="5" fill="none" stroke="#67e8f9" stroke-width="0.4" opacity="0.3"/>

  <!-- 水花 (左右對稱) -->
  <path d="M14 18 Q13 15 11 16" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M18 18 Q19 15 21 16" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="10" cy="15" r="1" fill="#67e8f9" opacity="0.8"/>
  <circle cx="22" cy="15" r="1" fill="#67e8f9" opacity="0.8"/>

  <!-- 硬幣 (正在落入) -->
  <ellipse cx="16" cy="12" rx="5" ry="2" fill="url(#coin)"/>
  <ellipse cx="16" cy="12" rx="3.5" ry="1.2" fill="none" stroke="#d97706" stroke-width="0.5"/>

  <!-- 硬幣上的數字符號 -->
  <text x="16" y="13" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
</svg>
